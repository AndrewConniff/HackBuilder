<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285e87"/></marker></defs><rect width="1700" height="1120" fill="#f5f8fc"/><g font-family="Segoe UI, sans-serif" fill="#142f49"><text x="50" y="55" font-size="34" font-weight="bold">Margie&apos;s Travel | Reference architecture</text><text x="50" y="90" font-size="21">Portable local reference — no live Azure target or capacity verified</text><rect x="35" y="120" width="1630" height="880" rx="20" fill="white" stroke="#91abc0" stroke-width="2"/><rect x="75" y="160" width="370" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="95" y="195" font-size="23" font-weight="bold">Operator browser</text><text x="95" y="230" font-size="18">Razor Pages + JavaScript</text><text x="95" y="256" font-size="18">Entra token held in memory</text><text x="95" y="282" font-size="18">Evidence links and queue status</text><rect x="620" y="160" width="465" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="640" y="195" font-size="23" font-weight="bold">.NET 10 · App Service</text><text x="640" y="230" font-size="18">JWT audience / tenant / operator checks</text><text x="640" y="256" font-size="18">Ingestion + chat + background worker</text><text x="640" y="282" font-size="18">Linux B1 candidate · Always On</text><rect x="1210" y="160" width="400" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="1230" y="195" font-size="23" font-weight="bold">Foundry Basic</text><text x="1230" y="230" font-size="18">AIServices → direct child project</text><text x="1230" y="256" font-size="18">One persisted prompt agent</text><text x="1230" y="282" font-size="18">Microsoft-managed agent state</text><rect x="75" y="480" width="400" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="