<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285e87"/></marker></defs><rect width="1700" height="1120" fill="#f5f8fc"/><g font-family="Segoe UI, sans-serif" fill="#142f49"><text x="50" y="55" font-size="34" font-weight="bold">Margie&apos;s Travel | Runtime, recovery and acceptance paths</text><text x="50" y="90" font-size="21">Portable local reference — no live Azure target or capacity verified</text><rect x="35" y="120" width="1630" height="880" rx="20" fill="white" stroke="#91abc0" stroke-width="2"/><rect x="75" y="160" width="440" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="95" y="195" font-size="23" font-weight="bold">1 · Accept synthetic feedback</text><text x="95" y="230" font-size="18">Validate schema and declared language</text><text x="95" y="256" font-size="18">Conditional raw blob create + hash</text><text x="95" y="282" font-size="18">Conflicting duplicate → HTTP 409</text><rect x="650" y="160" width="440" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="670" y="195" font-size="23" font-weight="bold">2 · Queue notification</text><text x="670" y="230" font-size="18">Stable feedback ID + correlation ID</text><text x="670" y="256" font-size="18">Raw blob is durable outbox</text><text x="670" y="282" font-size="18">30-second reconciliation resends</text><rect x="1200" y="160" width="410" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="1220" y="195" font-size="23" font-weight="bold">3 · Worker</text><text x="1220" y="230" font-size="18">90-second visibility / 60-second lease</text><text x="1220" y="256" font-size="18">Conditional processed evidence write</text><text x="1220" y="282" font-size="18">Delete message only after durability</text><rect x="1200" y="480" width="410" height="156" rx="14" fill="#fff1e5" stroke="#356b98" stroke-width="2"/><text x="1220" y="515" font-size="23" font-weight="bold">4 · Retry / negative path</text><text x="1220" y="550" font-size="18">Transient failure → bounded retry</text><text x="1220" y="576" font-size="18">Invalid / exhausted → poison + audit</text><text x="1220" y="602" font-size="18">Malformed JSON never reports success</text><rect x="650" y="480" width="440" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="670" y="515" font-size="23" font-weight="bold">5 · Retrieve Blob evidence</text><text x="670" y="550" font-size="18">Bounded dataset: maximum 100 records</text><text x="670" y="576" font-size="18">Filter category and source languages</text><text x="670" y="602" font-size="18">Preserve original-language excerpts</text><rect x="75" y="480" width="440" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="95" y="515" font-size="23" font-weight="bold">6 · Invoke real Foundry agent</text><text x="95" y="550" font-size="18">Agent-scoped Responses API v1</text><text x="95" y="576" font-size="18">MI token, no browser service secrets</text><text x="95" y="602" font-size="18">Missing endpoint → HTTP 503</text><rect x="75" y="790" width="440" height="156" rx="14" fill="#e5f2ff" stroke="#356b98" stroke-width="2"/><text x="95" y="825" font-size="23" font-weight="bold">7 · Validate response</text><text x="95" y="860" font-size="18">Exact ID + original quote checks</text><text x="95" y="886" font-size="18">Unverifiable citation → HTTP 502</text><text x="95" y="912" font-size="18">Browser renders safe text, not HTML</text><rect x="650" y="790" width="440" height="156" rx="14" fill="#edf6e8" stroke="#356b98" stroke-width="2"/><text x="670" y="825" font-size="23" font-weight="bold">8 · Show evidence and audit</text><text x="670" y="860" font-size="18">Response ID + evidence scope</text><text x="670" y="886" font-size="18">Correlated status and citation links</text><text x="670" y="912" font-size="18">No mock or local model success</text><path d="M515,238 L650,238" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="582" y="226" text-anchor="middle" font-size="17">enqueue</text><path d="M1090,238 L1200,238" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="1145" y="226" text-anchor="middle" font-size="17">receive</text><path d="M1500,316 L1500,480" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="1500" y="386" text-anchor="middle" font-size="17">failure</text><path d="M1300,316 L1300,390 L870,390 L870,480" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="1050" y="375" font-size="18">completed evidence</text><path d="M650,558 L515,558" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="582" y="546" text-anchor="middle" font-size="17">context</text><path d="M300,636 L300,790" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="300" y="701" text-anchor="middle" font-size="17">response</text><path d="M515,868 L650,868" stroke="#285e87" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="582" y="856" text-anchor="middle" font-size="17">checked</text><text x="1170" y="820" font-size="20">Local tests exercise Azurite.</text><text x="1170" y="855" font-size="20">Foundry / MI / live chat still pending.</text><text x="1170" y="890" font-size="20">Diagram is not deployment evidence.</text></g><text x="50" y="1050" font-family="Segoe UI, sans-serif" font-size="21" fill="#294b66">No Azure operation authorized here. Exact-target preflight → actual what-if review → deployment confirmation.</text></svg>