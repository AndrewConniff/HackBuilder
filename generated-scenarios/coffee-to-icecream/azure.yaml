name: tdd-azd-coffee-to-icecream
metadata:
  template: tddazd-coffee-to-icecream@1.0.0
infra:
  provider: bicep
  path: ./infra
services:
  web:
    project: ./src/CoffeeShop.Web
    language: dotnet
    host: appservice
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/Assert-DeploymentScope.ps1
    interactive: false
  postprovision:
    shell: pwsh
    run: ./scripts/Initialize-Scenario.ps1
    interactive: false
